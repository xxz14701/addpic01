<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="shortcut icon" href="01.png">
    <title>貼圖加素材</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

        :root {
            --primary-yellow: #FFD93D;
            --primary-pink: #FF6B6B;
            --primary-green: #6BCB77;
            --primary-blue: #4D96FF;
        }

        body {
            background-color: #FFF9E0;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
        }

        .canvas-container {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 10px solid white;
        }

        .canvas-bg {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #ffffff;
        }

        .candy-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom-width: 6px;
        }
        .candy-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .tab-active {
            background-color: var(--primary-pink) !important;
            color: white !important;
            transform: scale(1.05);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #FFD93D;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-white border-b-4 border-yellow-400 p-4 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                    <span class="text-3xl"></span>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">貼圖大師</h1>
                    <p class="text-sm font-bold text-red-500">超大按鈕！</p>
                </div>
            </div>
            <button onclick="downloadSticker()" class="candy-btn bg-green-500 border-green-700 hover:bg-green-600 text-white font-black px-8 py-3 rounded-2xl shadow-xl flex items-center gap-2 text-xl">
                <span>✅</span> 存起來
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
        
        <!-- 畫布區 -->
        <div class="lg:col-span-7 flex flex-col items-center order-1 lg:order-2">
            <div class="relative w-full max-w-[400px] aspect-square flex items-center justify-center p-4 bg-orange-100 rounded-[40px] border-4 border-dashed border-orange-300">
                <div class="canvas-container canvas-bg">
                    <canvas id="stickerCanvas"></canvas>
                </div>
            </div>
            
            <div class="mt-6 grid grid-cols-4 gap-4 w-full max-w-[450px]">
                <button onclick="zoomAdjust(1.2)" class="candy-btn bg-blue-400 border-blue-600 p-4 rounded-2xl text-3xl shadow-lg">➕</button>
                <button onclick="zoomAdjust(0.8)" class="candy-btn bg-blue-400 border-blue-600 p-4 rounded-2xl text-3xl shadow-lg">➖</button>
                <button onclick="flipObject()" class="candy-btn bg-purple-400 border-purple-600 p-4 rounded-2xl text-3xl shadow-lg">↔️</button>
                <button onclick="deleteObject()" class="candy-btn bg-red-400 border-red-600 p-4 rounded-2xl text-3xl shadow-lg">🗑️</button>
            </div>
            <div class="mt-4 flex gap-4 w-full max-w-[450px]">
                <button onclick="clearCanvas()" class="flex-1 py-3 text-lg font-bold text-slate-400 border-2 border-slate-300 rounded-xl hover:bg-slate-200">全部重做</button>
                <button onclick="canvas.bringToFront(canvas.getActiveObject());canvas.renderAll();" class="flex-1 py-3 bg-white text-lg font-bold text-blue-500 border-2 border-blue-400 rounded-xl shadow-sm">移到最前面</button>
            </div>
        </div>

        <!-- 左側素材區 -->
        <div class="lg:col-span-5 flex flex-col gap-6 order-2 lg:order-1">
            <div class="bg-white p-6 rounded-[32px] border-4 border-blue-200 shadow-xl">
                <h2 class="text-xl font-black text-blue-600 mb-4 flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm">1</span> 
                    第一步：放你的相片
                </h2>
                <label for="imageLoader" class="flex flex-col items-center justify-center w-full py-8 bg-blue-50 border-4 border-dashed border-blue-200 rounded-3xl cursor-pointer hover:bg-blue-100 transition-all">
                    <div class="text-5xl mb-2">📸</div>
                    <span class="text-xl font-black text-blue-700">點我選相片</span>
                </label>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </div>

            <div class="bg-white p-6 rounded-[32px] border-4 border-green-200 shadow-xl flex-1 flex flex-col">
                <h2 class="text-xl font-black text-green-600 mb-4 flex items-center gap-2">
                    <span class="bg-green-600 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm">2</span> 
                    第二步：加可愛圖案
                </h2>
                
                <div class="flex gap-2 mb-6 overflow-x-auto pb-2 custom-scroll">
                    <button onclick="showCategory('eyes')" id="tab-eyes" class="candy-btn bg-slate-100 border-slate-300 px-6 py-2 rounded-xl font-bold whitespace-nowrap text-lg">眼睛</button>
                    <button onclick="showCategory('mouth')" id="tab-mouth" class="candy-btn bg-slate-100 border-slate-300 px-6 py-2 rounded-xl font-bold whitespace-nowrap text-lg">嘴巴</button>
                    <button onclick="showCategory('ears')" id="tab-ears" class="candy-btn bg-slate-100 border-slate-300 px-6 py-2 rounded-xl font-bold whitespace-nowrap text-lg">五官</button>
                    <button onclick="showCategory('deco')" id="tab-deco" class="candy-btn bg-slate-100 border-slate-300 px-6 py-2 rounded-xl font-bold whitespace-nowrap text-lg">配件</button>
                    <button onclick="showCategory('word')" id="tab-word" class="candy-btn bg-slate-100 border-slate-300 px-6 py-2 rounded-xl font-bold whitespace-nowrap text-lg">說說話</button>
                </div>

                <div class="grid grid-cols-3 sm:grid-cols-4 gap-4 overflow-y-auto max-h-[400px] pr-2 custom-scroll" id="sticker-grid">
                </div>
            </div>
        </div>
    </main>

    <div class="bg-yellow-100 p-4 text-center">
        <p class="text-lg font-bold text-yellow-700">Billy ^.^ | Program improved by AI @2026</p>
    </div>

    <script>
        const CW = 350;
        const CH = 350;
        let canvas;

        // --- 完整修復素材庫 ---
        const cartoonAssets = {
            // 眼睛
            bigEyes: { name: '大眼睛', cat: 'eyes', svg: `<svg viewBox="0 0 100 50"><circle cx="30" cy="25" r="22" fill="white" stroke="black" stroke-width="5"/><circle cx="30" cy="25" r="10" fill="black"/><circle cx="70" cy="25" r="22" fill="white" stroke="black" stroke-width="5"/><circle cx="70" cy="25" r="10" fill="black"/></svg>`, paths: [{ type: 'circle', cx: 30, cy: 25, r: 22, fill: 'white', stroke: 'black', sw: 5 }, { type: 'circle', cx: 30, cy: 25, r: 10, fill: 'black' }, { type: 'circle', cx: 70, cy: 25, r: 22, fill: 'white', stroke: 'black', sw: 5 }, { type: 'circle', cx: 70, cy: 25, r: 10, fill: 'black' }] },
            squintEyes: { name: '笑瞇瞇', cat: 'eyes', svg: `<svg viewBox="0 0 100 50"><path d="M10,30 Q30,5 50,30" fill="none" stroke="black" stroke-width="8"/><path d="M55,30 Q75,5 95,30" fill="none" stroke="black" stroke-width="8"/></svg>`, paths: [{ d: 'M10 30 Q30 5 50 30', fill: 'none', stroke: 'black', sw: 8 }, { d: 'M55 30 Q75 5 95 30', fill: 'none', stroke: 'black', sw: 8 }] },
            heartEyes: { name: '愛心眼', cat: 'eyes', svg: `<svg viewBox="0 0 100 50"><path d="M25,10 C10,10 10,35 25,45 C40,35 40,10 25,10" fill="#FF4757" stroke="black" stroke-width="2"/><path d="M75,10 C60,10 60,35 75,45 C90,35 90,10 75,10" fill="#FF4757" stroke="black" stroke-width="2"/></svg>`, paths: [{ d: 'M25 10 C10 10 10 35 25 45 C40 35 40 10 25 10', fill: '#FF4757', stroke: 'black', sw: 2 }, { d: 'M75 10 C60 10 60 35 75 45 C90 35 90 10 75 10', fill: '#FF4757', stroke: 'black', sw: 2 }] },
            
            // 嘴巴
            tongueOut: { name: '吐舌頭', cat: 'mouth', svg: `<svg viewBox="0 0 100 60"><path d="M20,20 Q50,45 80,20" fill="none" stroke="black" stroke-width="6"/><path d="M40,30 Q40,58 50,58 Q60,58 60,30 Z" fill="#FF7F7F" stroke="black" stroke-width="3"/></svg>`, paths: [{ d: 'M20 20 Q50 45 80 20', fill: 'none', stroke: 'black', sw: 6 }, { d: 'M40 30 Q40 58 50 58 Q60 58 60 30 Z', fill: '#FF7F7F', stroke: 'black', sw: 3 }] },
            wideSmile: { name: '大笑', cat: 'mouth', svg: `<svg viewBox="0 0 100 60"><path d="M20,20 Q50,60 80,20 Z" fill="white" stroke="black" stroke-width="4"/><path d="M30,35 Q50,45 70,35" fill="none" stroke="#FFB6C1" stroke-width="4"/></svg>`, paths: [{ d: 'M20 20 Q50 60 80 20 Z', fill: 'white', stroke: 'black', sw: 4 }, { d: 'M30 35 Q50 45 70 35', fill: 'none', stroke: '#FFB6C1', sw: 4 }] },
            duckMouth: { name: '鴨子嘴', cat: 'mouth', svg: `<svg viewBox="0 0 100 60"><path d="M30,30 Q50,10 70,30 Q50,50 30,30" fill="#FFD93D" stroke="black" stroke-width="3"/><line x1="30" y1="30" x2="70" y2="30" stroke="black" stroke-width="2"/></svg>`, paths: [{ d: 'M30 30 Q50 10 70 30 Q50 50 30 30', fill: '#FFD93D', stroke: 'black', sw: 3 }, { type: 'line', x1: 30, y1: 30, x2: 70, y2: 30, stroke: 'black', sw: 2 }] },

            // 五官 (耳朵/鼻子)
            pigNose: { name: '豬鼻子', cat: 'ears', svg: `<svg viewBox="0 0 100 60"><ellipse cx="50" cy="30" rx="35" ry="25" fill="#FFB6C1" stroke="black" stroke-width="4"/><circle cx="35" cy="30" r="7" fill="#D08090"/><circle cx="65" cy="30" r="7" fill="#D08090"/></svg>`, paths: [{ type: 'ellipse', cx: 50, cy: 30, rx: 35, ry: 25, fill: '#FFB6C1', stroke: 'black', sw: 4 }, { type: 'circle', cx: 35, cy: 30, r: 7, fill: '#D08090' }, { type: 'circle', cx: 65, cy: 30, r: 7, fill: '#D08090' }] },
            mustache: { name: '翹鬍子', cat: 'ears', svg: `<svg viewBox="0 0 100 40"><path d="M10,30 Q30,30 50,15 Q70,30 90,30 Q70,45 50,20 Q30,45 10,30" fill="black"/></svg>`, paths: [{ d: 'M10 30 Q30 30 50 15 Q70 30 90 30 Q70 45 50 20 Q30 45 10 30', fill: 'black' }] },
            catEars: { name: '貓耳朵', cat: 'ears', svg: `<svg viewBox="0 0 100 60"><path d="M10,50 L30,10 L50,50 Z" fill="#333"/><path d="M50,50 L70,10 L90,50 Z" fill="#333"/></svg>`, paths: [{ d: 'M10 50 L30 10 L50 50 Z', fill: '#333' }, { d: 'M50 50 L70 10 L90 50 Z', fill: '#333' }] },
            rabbitEars: { name: '兔耳朵', cat: 'ears', svg: `<svg viewBox="0 0 100 60"><ellipse cx="35" cy="30" rx="12" ry="30" fill="white" stroke="black" stroke-width="2"/><ellipse cx="65" cy="30" rx="12" ry="30" fill="white" stroke="black" stroke-width="2"/></svg>`, paths: [{ type: 'ellipse', cx: 35, cy: 30, rx: 12, ry: 30, fill: 'white', stroke: 'black', sw: 2 }, { type: 'ellipse', cx: 65, cy: 30, rx: 12, ry: 30, fill: 'white', stroke: 'black', sw: 2 }] },

            // 配件
            crown: { name: '皇冠', cat: 'deco', svg: `<svg viewBox="0 0 100 60"><path d="M20,50 L10,15 L35,35 L50,10 L65,35 L90,15 L80,50 Z" fill="#FFD700" stroke="#B8860B" stroke-width="3"/></svg>`, paths: [{ d: 'M20 50 L10 15 L35 35 L50 10 L65 35 L90 15 L80 50 Z', fill: '#FFD700', stroke: '#B8860B', sw: 3 }] },
            sunglasses: { name: '墨鏡', cat: 'deco', svg: `<svg viewBox="0 0 100 40"><rect x="10" y="10" width="35" height="25" rx="5" fill="black"/><rect x="55" y="10" width="35" height="25" rx="5" fill="black"/><path d="M45,20 Q50,20 55,20" stroke="black" stroke-width="4"/></svg>`, paths: [{ type: 'rect', x: 10, y: 10, w: 35, h: 25, rx: 5, fill: 'black' }, { type: 'rect', x: 55, y: 10, w: 35, h: 25, rx: 5, fill: 'black' }, { d: 'M45 20 Q50 20 55 20', fill: 'none', stroke: 'black', sw: 4 }] },
            rainbow: { name: '彩虹', cat: 'deco', svg: `<svg viewBox="0 0 100 50"><path d="M10,45 Q50,5 90,45" fill="none" stroke="red" stroke-width="5"/><path d="M15,45 Q50,10 85,45" fill="none" stroke="orange" stroke-width="5"/><path d="M20,45 Q50,15 80,45" fill="none" stroke="yellow" stroke-width="5"/></svg>`, paths: [{ d: 'M10 45 Q50 5 90 45', fill: 'none', stroke: 'red', sw: 5 }, { d: 'M15 45 Q50 10 85 45', fill: 'none', stroke: 'orange', sw: 5 }, { d: 'M20 45 Q50 15 80 45', fill: 'none', stroke: 'yellow', sw: 5 }] }
        };

        const stickerData = {
            eyes: ['bigEyes', 'squintEyes', 'heartEyes'],
            mouth: ['tongueOut', 'wideSmile', 'duckMouth'],
            ears: ['pigNose', 'mustache', 'catEars', 'rabbitEars'],
            deco: ['sunglasses', 'crown', 'rainbow', '❤️', '⭐', '🔥', '✨', '🎈', '🌹', '👍'],
            word: ['早安', '平安', '吃飽沒', '真棒', '想你', '哈哈哈', '感恩', 'OK']
        };

        window.onload = function() {
            canvas = new fabric.Canvas('stickerCanvas', {
                width: CW,
                height: CH,
                backgroundColor: 'transparent',
                preserveObjectStacking: true
            });

            fabric.Object.prototype.set({
                transparentCorners: false,
                cornerColor: '#FF6B6B',
                cornerStrokeColor: '#ffffff',
                cornerSize: 24,
                padding: 10,
                cornerStyle: 'circle'
            });

            showCategory('word');
        };

        function showCategory(cat) {
            document.querySelectorAll('.candy-btn').forEach(t => t.classList.remove('tab-active'));
            const targetTab = document.getElementById(`tab-${cat}`);
            if (targetTab) targetTab.classList.add('tab-active');

            const grid = document.getElementById('sticker-grid');
            grid.innerHTML = '';
            
            const list = stickerData[cat] || [];
            list.forEach(key => {
                const btn = document.createElement('button');
                btn.className = "p-4 bg-white rounded-3xl border-4 border-slate-100 hover:border-yellow-400 hover:shadow-xl transition-all flex items-center justify-center aspect-square shadow-sm";
                
                if (cartoonAssets[key]) {
                    btn.innerHTML = cartoonAssets[key].svg;
                    btn.onclick = () => addCartoonGroup(key);
                } else if (cat === 'word') {
                    btn.innerHTML = `<span class="text-xl font-black text-blue-600">${key}</span>`;
                    btn.onclick = () => addText(key);
                } else {
                    btn.innerHTML = `<span class="text-5xl">${key}</span>`;
                    btn.onclick = () => addEmoji(key);
                }
                grid.appendChild(btn);
            });
        }

        function addCartoonGroup(key) {
            const asset = cartoonAssets[key];
            const objs = asset.paths.map(p => {
                if (p.type === 'circle') return new fabric.Circle({ radius: p.r, left: p.cx, top: p.cy, fill: p.fill, stroke: p.stroke, strokeWidth: p.sw || 0, originX: 'center', originY: 'center' });
                if (p.type === 'ellipse') return new fabric.Ellipse({ rx: p.rx, ry: p.ry, left: p.cx, top: p.cy, fill: p.fill, stroke: p.stroke, strokeWidth: p.sw || 0, originX: 'center', originY: 'center' });
                if (p.type === 'rect') return new fabric.Rect({ left: p.x, top: p.y, width: p.w, height: p.h, rx: p.rx, ry: p.rx, fill: p.fill, stroke: p.stroke, strokeWidth: p.sw || 0, originX: 'center', originY: 'center' });
                if (p.type === 'line') return new fabric.Line([p.x1, p.y1, p.x2, p.y2], { stroke: p.stroke, strokeWidth: p.sw || 2, originX: 'center', originY: 'center' });
                return new fabric.Path(p.d, { fill: p.fill, stroke: p.stroke, strokeWidth: p.sw || 0, originX: 'center', originY: 'center' });
            });
            const group = new fabric.Group(objs, { left: CW/2, top: CH/2, originX: 'center', originY: 'center', scaleX: 1.5, scaleY: 1.5 });
            canvas.add(group);
            canvas.setActiveObject(group);
        }

        function addEmoji(emoji) {
            const text = new fabric.Text(emoji, { left: CW/2, top: CH/2, fontSize: 100, originX: 'center', originY: 'center' });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addText(val) {
            const text = new fabric.IText(val, {
                left: CW/2, top: CH/2, fontFamily: 'Noto Sans TC', fontWeight: '900', fontSize: 60,
                fill: '#FF6B6B', stroke: 'white', strokeWidth: 10, paintFirst: 'stroke',
                originX: 'center', originY: 'center'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    const scale = Math.min(CW / img.width, CH / img.height) * 0.8;
                    img.set({ left: CW/2, top: CH/2, originX: 'center', originY: 'center', scaleX: scale, scaleY: scale });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    canvas.sendToBack(img);
                });
            };
            reader.readAsDataURL(file);
        });

        function zoomAdjust(f) {
            const a = canvas.getActiveObject();
            if (a) { a.scale(a.scaleX * f); canvas.renderAll(); }
        }
        function flipObject() {
            const a = canvas.getActiveObject();
            if (a) { a.set('flipX', !a.flipX); canvas.renderAll(); }
        }
        function deleteObject() {
            const a = canvas.getActiveObject();
            if (a) canvas.remove(a);
        }
        function clearCanvas() { if (confirm('確定要清空嗎？')) canvas.clear(); }
        
        function downloadSticker() {
            canvas.discardActiveObject();
            canvas.renderAll();
            const link = document.createElement('a');
            link.download = `我的貼圖.png`;
            link.href = canvas.toDataURL({ format: 'png', quality: 1 });
            link.click();
            
            const notice = document.createElement('div');
            notice.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-10 rounded-3xl border-8 border-green-500 shadow-2xl z-[100] text-center w-80";
            notice.innerHTML = "<h3 class='text-4xl font-black mb-4'>存好囉！🎉</h3><p class='text-xl'>快去傳給家人看吧！</p>";
            document.body.appendChild(notice);
            setTimeout(() => notice.remove(), 2500);
        }
    </script>
</body>
</html>
